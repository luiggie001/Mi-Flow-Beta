<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><link rel="manifest" href="./manifest.webmanifest"><title>Mi Flow Beta</title><style>
:root{--bg:#0d0f12;--card:#171a20;--line:#292e38;--text:#f7f8fa;--muted:#a9b0bc;--a:#b7ff4a;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}main{max-width:560px;margin:auto;padding:22px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:24px;font-weight:900}.beta,.pill{font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.hero{text-align:center;padding:28px 18px}.eyebrow{font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:800}.money{font-size:46px;font-weight:900;margin:6px}.good{color:var(--a)}.bad{color:var(--bad)}h1{font-size:30px;line-height:1.08}h2{font-size:20px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}button{width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;background:var(--a);color:#0b0d0f;margin-top:10px}.secondary{background:#232832;color:var(--text)}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#101318;color:var(--text);font-size:16px;margin:7px 0 12px}label{font-size:13px;color:var(--muted);font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#111419;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.nav button{max-width:112px;background:transparent;color:var(--muted);font-size:12px;margin:0;padding:14px 7px}.nav button.on{color:var(--a)}.hide{display:none}.empty{text-align:center;color:var(--muted);padding:26px}.paybox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.payactions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.payactions button{margin-top:0}
</style></head><body><main id="app"></main><div class="nav hide" id="nav"></div><script>
const K="miflow_beta_v1";let s=JSON.parse(localStorage.getItem(K)||"null")||{setup:false,balance:0,nextPay:"",expected:0,bills:[],needs:[],tx:[]};let screen="home";const save=()=>localStorage.setItem(K,JSON.stringify(s));const money=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n||0));const billPending=b=>b.paid?0:Math.max(0,Number(b.amount||0)-Number(b.paidAmount||0));const pending=()=>s.bills.reduce((a,x)=>a+billPending(x),0);const needs=()=>s.needs.reduce((a,x)=>a+Math.max(0,+x.budget-(+x.spent||0)),0);const flow=()=>+s.balance-pending()-needs();const days=()=>s.nextPay?Math.max(0,Math.ceil((new Date(s.nextPay+"T12:00:00")-new Date())/86400000)):null;
function shell(x){app.innerHTML='<div class="top"><div class="logo">Mi Flow</div><span class="beta">BETA</span></div>'+x;nav.innerHTML=["home|Inicio","bills|Pagos","expense|Gasto","history|Historial","more|Más"].map(x=>{let[a,b]=x.split("|");return `<button class="${screen==a?"on":""}" onclick="go('${a}')">${b}</button>`}).join("");nav.classList.toggle("hide",!s.setup)}function go(x){screen=x;render()}
function setup(){shell(`<h1>Tu balance no es lo mismo que tu dinero disponible.</h1><p class="muted">Mi Flow protege tus pagos y lo que necesitas para vivir, y te enseña lo que realmente está libre hasta que vuelvas a cobrar.</p><div class="card"><label>¿Cuánto tienes ahora?</label><input id="bal" type="number" step=".01"><label>¿Cuándo vuelves a cobrar?</label><input id="pay" type="date"><label>Cantidad esperada (opcional)</label><input id="exp" type="number" step=".01"></div><button onclick="start()">Calcular mi Flow</button>`)}
function start(){s.balance=+bal.value||0;s.nextPay=pay.value;s.expected=+exp.value||0;s.setup=true;save();screen="bills";render()}
function home(){let f=flow(),d=days(),daily=d?f/d:null;shell(`<div class="card hero"><div class="eyebrow">TU FLOW</div><div class="money ${f<0?"bad":"good"}">${money(f)}</div><div class="muted">${s.nextPay?"Libre hasta "+new Date(s.nextPay+"T12:00:00").toLocaleDateString("es-US",{day:"numeric",month:"long"}):"Configura tu próximo cobro"}</div>${daily!==null?`<span class="pill">${d} días · ~${money(daily)}/día</span>`:""}</div><div class="card"><div class="row"><span>Saldo actual</span><b>${money(s.balance)}</b></div><div class="row"><span>Pagos protegidos</span><b>−${money(pending())}</b></div><div class="row"><span>Disponible después de pagos</span><b>${money(s.balance-pending())}</b></div><div class="row"><span>Para vivir</span><b>−${money(needs())}</b></div><div class="row"><b>Tu Flow</b><b class="${f<0?"bad":"good"}">${money(f)}</b></div></div><button onclick="go('expense')">＋ Registrar gasto</button>`)}
function bills(){shell(`<h2>Pagos protegidos</h2><div class="card"><label>Nombre</label><input id="bn" placeholder="Ej. Renta"><label>Cantidad</label><input id="ba" type="number" step=".01"><label>Fecha</label><input id="bd" type="date"><button onclick="addBill()">Añadir pago</button></div>${s.bills.length?s.bills.map((b,i)=>{let p=billPending(b),paid=Number(b.paidAmount||0);return `<div class="card"><div class="row"><b>${b.name}</b><b>${money(b.amount)}</b></div><div class="muted">${b.date||"Sin fecha"} · ${p<=0?"Pagado":paid>0?money(p)+" pendiente":"Protegido"}</div>${paid>0&&p>0?`<div class="muted">Pagado hasta ahora: ${money(paid)}</div>`:""}${p>0?`<div class="paybox"><label>¿Cuánto pagaste?</label><input id="payamt${i}" type="number" step=".01" min=".01" placeholder="${money(p)}"><div class="payactions"><button class="secondary" onclick="fillFull(${i})">Pago completo</button><button onclick="payBill(${i})">Registrar pago</button></div></div>`:""}</div>`}).join(""):'<div class="empty">Todavía no hay pagos.</div>'}`)}
function addBill(){if(!bn.value||!+ba.value)return;s.bills.push({name:bn.value,amount:+ba.value,date:bd.value,paid:false,paidAmount:0});save();render()}function fillFull(i){let el=document.getElementById("payamt"+i);if(el)el.value=billPending(s.bills[i]).toFixed(2)}function payBill(i){let b=s.bills[i],p=billPending(b),el=document.getElementById("payamt"+i),a=Number(el&&el.value);if(!a||a<=0)return;s.balance-=a;b.paidAmount=Number(b.paidAmount||0)+Math.min(a,p);if(b.paidAmount>=Number(b.amount||0)){b.paid=true;b.paidAmount=Number(b.amount||0)}else{b.paid=false}s.tx.unshift({type:"Pago",name:b.name,amount:a,date:new Date().toISOString()});save();render()}
function expense(){shell(`<h2>Registrar gasto</h2><div class="card"><label>Cantidad</label><input id="ea" type="number" step=".01"><label>¿De dónde sale?</label><select id="ec"><option value="flow">Mi Flow</option>${s.needs.map((n,i)=>`<option value="${i}">${n.name}</option>`).join("")}</select><label>Nota (opcional)</label><input id="en"><button onclick="addExpense()">Registrar</button></div><h2>Presupuesto para vivir</h2><div class="card"><label>Categoría</label><input id="nn" placeholder="Ej. Compra"><label>Presupuesto hasta cobrar</label><input id="nb" type="number" step=".01"><button class="secondary" onclick="addNeed()">Añadir categoría</button></div>`)}
function addNeed(){if(!nn.value||!+nb.value)return;s.needs.push({name:nn.value,budget:+nb.value,spent:0});save();render()}function addExpense(){let a=+ea.value;if(!a)return;s.balance-=a;let c=ec.value,n="Mi Flow";if(c!="flow"){s.needs[+c].spent=(s.needs[+c].spent||0)+a;n=s.needs[+c].name}s.tx.unshift({type:"Gasto",name:en.value||n,amount:a,date:new Date().toISOString()});save();screen="home";render()}
function history(){shell(`<h2>Historial</h2>${s.tx.length?s.tx.map(t=>`<div class="card"><div class="row"><span><b>${t.name}</b><br><span class="muted">${t.type}</span></span><b>${t.type=="Ingreso"?"+":"−"}${money(Math.abs(t.amount))}</b></div><div class="muted">${new Date(t.date).toLocaleString("es-US")}</div></div>`).join(""):'<div class="empty">Todavía no hay movimientos.</div>'}`)}
function more(){shell(`<h2>Más</h2><div class="card"><label>Saldo actual</label><input id="mb" type="number" step=".01" value="${s.balance}"><label>Próximo cobro</label><input id="mp" type="date" value="${s.nextPay}"><label>Cantidad esperada</label><input id="me" type="number" step=".01" value="${s.expected}"><button onclick="upd()">Guardar</button></div><div class="card"><h2>Recibí dinero</h2><label>Cantidad real recibida</label><input id="inc" type="number" step=".01"><button onclick="income()">Registrar ingreso</button></div><button class="secondary" onclick="resetApp()">Reiniciar Beta</button>`)}
function upd(){s.balance=+mb.value||0;s.nextPay=mp.value;s.expected=+me.value||0;save();screen="home";render()}function income(){let a=+inc.value;if(!a)return;s.balance+=a;s.tx.unshift({type:"Ingreso",name:"Ingreso",amount:a,date:new Date().toISOString()});save();screen="home";render()}function resetApp(){if(confirm("¿Borrar todos los datos de esta Beta en este dispositivo?")){localStorage.removeItem(K);location.reload()}}
function render(){if(!s.setup)return setup();({home,bills,expense,history,more}[screen]||home)()}if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");render();
</script></body></html>
